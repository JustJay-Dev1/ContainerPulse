apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: containerpulse

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:

      containers:

      - name: postgres

        image: postgres:16

        ports:
        - containerPort: 5432

        env:

        - name: POSTGRES_DB
          value: monitoring

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: containerpulse-secret
              key: DATABASE_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: containerpulse-secret
              key: DATABASE_PASSWORD

        volumeMounts:

        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:

  - metadata:
      name: postgres-storage

    spec:

      accessModes:
        - ReadWriteOnce

      resources:
        requests:
          storage: 5Gi